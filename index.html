<!doctype html>
<html>
  <head>
    <title>Hukitori</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/pixi.js/pixi.min.js"></script>
</head>
  <body>
    <script>
    (async function () {
      let pixels = [];
      let imagedata = null;

      let app = new PIXI.Application();
      await app.init({ width: 960, height: 540, background: 0xf0f0f0 });
      document.body.appendChild(app.canvas);

      let socket = io();

      socket.on("imagedata", function (e) {
        imagedata = e;
      });

      function rect(x, y, color) {
        let width = ~~(app.screen.width / imagedata.pixels[0].length) - 1;
        let height = ~~(app.screen.height / imagedata.pixels.length) - 1;
        let px = x * width + x;
        let py = y * height + y;

        let graphics = new PIXI.Graphics()
          .rect(px, py, width, height)
          .fill(color);

        graphics.position.set(x, y);
        graphics.alpha = 1;
        graphics.remain_time = 0;
        graphics.remain_max = 500;
        graphics.eventMode = 'static';
        graphics.hitArea = new PIXI.Rectangle(px, py, width, height);

        graphics.on('pointerover', function () {
          this.alpha = 1;
          this.remain_time = this.remain_max;
          socket.emit("pos", { x: this.position.x, y: this.position.y });
        });

        graphics.tail = function () {
          this.alpha = 1;
          this.remain_time = this.remain_max;
        };

        return graphics;
      }

      function stepSerpentine(pos, scan) {
        const w = imagedata.pixels[0].length;
        const h = imagedata.pixels.length;
        if (scan.dir === 1) {
          if (pos.x < w - 1) {
            pos.x++;
          } else if (pos.y < h - 1) {
            pos.y++;
            scan.dir = -1;
          } else {
            pos.x = 0;
            pos.y = 0;
            scan.dir = 1;
          }
        } else if (pos.x > 0) {
          pos.x--;
        } else if (pos.y < h - 1) {
          pos.y++;
          scan.dir = 1;
        } else {
          pos.x = 0;
          pos.y = 0;
          scan.dir = 1;
        }
      }

      (function _game() {
        if (!imagedata) {
          requestAnimationFrame(_game);
          console.log("Loading...");
          return;
        }

        for (let x = 0; x < imagedata.pixels[0].length; x++) {
          pixels[x] = [];
          for (let y = 0; y < imagedata.pixels.length; y++) {
            let rgb = imagedata.pixels[y][x];
            let rc = rect(x, y, rgb);
            pixels[x][y] = rc;
            app.stage.addChild(rc);
          }
        }

        if (1) {
          (function () {
            let pos = { x: 0, y: 0 };
            pos.y = ~~(Math.random() * imagedata.pixels.length);
            pos.x = ~~(Math.random() * imagedata.pixels[pos.y].length);
            let limitx = imagedata.pixels.length;
            let limity = imagedata.pixels[pos.y].length;

            (function _debugloop() {
              requestAnimationFrame(_debugloop);

              switch (~~(Math.random() * 8)) {
                case 0: pos.y--; break;
                case 1: pos.y--; pos.x++; break;
                case 2: pos.x++; break;
                case 3: pos.y++; pos.x++; break;
                case 4: pos.y++; break;
                case 5: pos.y++; pos.x--; break;
                case 6: pos.x--; break;
                case 7: pos.x--; pos.y--; break;
              }

              if (pos.x <= 0) { pos.x = limitx; }
              if (pos.x >= limitx) { pos.x = 0; }
              if (pos.y <= 0) { pos.y = limity; }
              if (pos.y >= limity) { pos.y = 0; }

              let rc = pixels[pos.x][pos.y];
              if (rc) {
                rc.tail();
              }

              socket.emit("pos", pos);
            })();
          })();
        }

        socket.on("pos", function (e) {
          let rc = pixels[e.x][e.y];
          if (rc) {
            rc.tail();
          }
        });

        (function animate() {
          requestAnimationFrame(animate);

          for (let y = 0, my = imagedata.pixels.length; y < my; y++) {
            for (let x = 0, mx = imagedata.pixels[y].length; x < mx; x++) {
              let r = pixels[x][y];
              if (r.remain_time >= 0) {
                r.alpha = (r.remain_time-- / r.remain_max);
              }
            }
          }
          app.render();
        })();
      })();
    })();
    </script>
  </body>
</html>
